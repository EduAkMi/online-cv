career-profile:
  title: Perfil Profissional
  summary: |
    Desenvolvedor mobile apaixonado com forte expertise em Kotlin/Java, REST APIs, testes e bancos de dados SQL, dedicado a construir aplicações de alto desempenho e escaláveis. Experiente em todo o ciclo de desenvolvimento, desde a prototipagem até a implantação e manutenção, seguindo as melhores práticas ágeis. Obteve um MBA em Desenvolvimento Mobile em 2023, expandindo suas habilidades em microsserviços, Flutter, React, iOS e aplicações baseadas em IA.
education:
  title: Formação
  info:
  - degree: MBA em Desenvolvimento Mobile
    university: FIAP
    time: 10/2022 - 10/2023
    details: |
      Este MBA proporcionou uma educação abrangente sobre as tecnologias mais recentes em desenvolvimento de aplicativos mobile, como Android, iOS (Swift), React Native, Flutter, arquitetura de microsserviços, chatbots e muito mais.
  - degree: Bacharelado em Ciências da Computação
    university: Universidade Estadual Paulista "Júlio de Mesquita Filho" - UNESP
    time: 03/2013 - 06/2019
    details: |
      Bacharelado focado nas diversas áreas da Ciência da Computação, como Estrutura de Dados, microprocessadores, análise de sistemas, arquitetura de computadores, engenharia de software e muito mais.

experiences:
  title: Experiências
  info:
  - role: Desenvolvedor Android
    time: 06/2022 - Atual
    company: BEES, Campinas - Brazil
    details: |
      Trabalhando no aplicativo BEES Force, desenvolvi funcionalidades para aumentar a produtividade e benefícios para trabalhadores B2B:

        • Implementei funcionalidades para Monetização, Performance do Usuário, Sincronização, Perfil, Fluxo de Trabalho, etc

        • Reviso código e submissões

        • Implantei processos no pipeline para catalogar alterações

        • Criei eventos para depuração e integração de equipe

        • Coordenei uma equipe para iniciativas de BFF e introduzi onboarding para novos membros
  - role: Engenheiro de Software
    time: 09/2020 - 06/2022
    company: SiDi, Campinas - Brazil
    details: |
        • Prototipei um sistema de posicionamento indoor B2B para o setor de varejo, projetando a arquitetura e desenvolvendo-o

        • Realizei manutenção e melhorias em dispositivos Samsung, com foco principalmente em funcionalidades de Bluetooth, WiFi e banco de dados

        • Participei de discussões com equipes globais fornecendo validações técnicas para o desenvolvimento de novos produtos
  - role: Professor Assistente de Android
    time: 08/2020 - 07/2021
    company: Digital House, Brazil
    details: |
        • Auxiliei no aprendizado de mais de 100 alunos iniciando no desenvolvimento Android

        • Realizei mentoria para reforçar e abstrair conhecimentos adicionais

        • Criei conteúdo para aulas e exercícios em equipe

        • Revisei submissões de projetos individuais e em equipe, fornecendo feedbacks e melhorias para cada submissão
