experiences:
  title: Experiences
  info:
    - role: Android Developer
      time: 07/2025 - Present
      company: Ontop, San Francisco - USA
      details: |
        Working on the Ontop Android app enabling workers around the world to use their money in the best possible way, using Kotlin, Jetpack Compose, GraphQL, Coroutines and Clean Architecture.

        • Delivered features for USDC account, UI toolkit and crypto transfer

        • Integrated GraphQL APIs and improved network layer using OkHttp

        • Added developer tooling into the application to improve team work efficiency

        • Reviewed code and submissions following clean code best practices
    - role: Android Developer
      time: 06/2022 - 07/2025
      company: BEES, Campinas - Brazil
      details: |
        Worked for the BEES Force application, developing features to increase productivity and benefits for B2B workers using Kotlin, MVVM, Hilt, Room, Retrofit, Coroutines and Flow:

          • Implemented features for Monetization, User Performance, Synchronization, Profile and Workflow modules

          • Deployed CI/CD pipeline processes on Gradle to catalog and automate release changes

          • Created analytics events for debugging and cross-team integration

          • Coordinated a team for BFF (Backend for Frontend) initiatives and introduced onboarding documentation for newcomers
    - role: Software Engineer
      time: 09/2020 - 06/2022
      company: SiDi, Campinas - Brazil
      details: |
        • Prototyped a B2B indoor positioning system for the retail sector, designing the architecture and developing it
        
        • Provided maintenance and improvements on Samsung's devices, focusing mainly on features from Bluetooth, WiFi and database
        
        • Participated in discussions with global teams sharing technical validations for the development of new products
    - role: Android Assistant Teacher
      time: 08/2020 - 07/2021
      company: Digital House, Brazil
      details: |
        • Assisted on the learning of more than 100 students initiating on the Android development
        
        • Performed mentoring on fixed hours to reinforce and abstract additional knowledge
        
        • Created content for classes and team exercises
        
        • Reviewed single and team projects submissions, providing feedbacks and improvements for each submission
