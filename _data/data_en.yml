career-profile:
  title: Career Profile
  summary: |
    Passionate Android Mobile Developer with strong expertise in Kotlin, Java, Jetpack Compose, Coroutines, Flow, MVVM, Clean Architecture, REST APIs, GraphQL, and SQL databases, dedicated to building high-performance and scalable applications. Experienced in the full development lifecycle, from prototyping to deployment and maintenance, following agile best practices. Skilled in dependency injection (Hilt/Dagger), Room, Retrofit, OkHttp, and unit/instrumented testing (JUnit, Mockito, Espresso). Earned an MBA in Mobile Development in 2023, expanding skills in microservices, Flutter, React, iOS, and AI-driven applications.
